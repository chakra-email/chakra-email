package_manager = "pnpm"
hostnames = ["preview.chakra-email.test"]
mode = "lazy"
subtype = "app"
role = "site"
source = "byo"
enabled = true
id = "unt_wks_workspace_users_ryanhefner_code_open_source_chakra_email_email_preview"

