packages:
  - 'packages/*'
  - 'apps/*'

linkWorkspacePackages: true
preferWorkspacePackages: true
autoInstallPeers: false
verifyDepsBeforeRun: false

allowBuilds:
  '@swc/core': true
  esbuild: true
  nx: true

overrides:
  '@chakra-docs/core': file:apps/site/.yalc/@chakra-docs/core
  '@chakra-docs/search': file:apps/site/.yalc/@chakra-docs/search
  axios: ^1.18.1
  browserslist: ^4.28.9
  fast-uri: ^3.1.6
  js-yaml: ^4.3.1
  nanoid: ^3.3.18
  'nx>brace-expansion': 5.0.9
  'nx>smol-toml': 1.7.1
  qs: ^6.16.0
