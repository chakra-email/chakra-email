packages:
  - 'packages/*'
  - 'apps/*'

linkWorkspacePackages: true
preferWorkspacePackages: true
autoInstallPeers: false
verifyDepsBeforeRun: false

allowBuilds:
  '@swc/core': true
  esbuild: true
  nx: true

overrides:
  'source-map-js@<1.2.2': 1.2.2
  axios: ^1.18.1
  browserslist: ^4.28.9
  'brace-expansion@<1.1.21': 1.1.21
  'brace-expansion@>=4.0.0 <5.0.12': 5.0.12
  'engine.io@>=6.6.0 <6.6.10': 6.6.10
  fast-uri: ^3.1.8
  'follow-redirects@>=1.16.0 <1.16.1': 1.16.1
  js-yaml: ^4.3.1
  nanoid: ^3.3.18
  'nx>smol-toml': 1.9.0
  qs: ^6.16.0
  'undici@>=7.0.0 <7.30.1': 7.30.1

minimumReleaseAgeExclude:
  - react-structured@0.2.0
  - next-meta@0.5.0
  - react-fathom@0.3.0
  - '@chakra-docs/chakra@0.3.0'
  - '@chakra-docs/core@0.3.0'
  - '@chakra-docs/search@0.3.0'
  - '@chakra-docs/shiki@0.3.0'
