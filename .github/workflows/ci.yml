name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (Node ${{ matrix.node-label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - node-label: 22
            node-version: 22
          - node-label: 24
            node-version: 24.18.0
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install pinned npm
        run: npm install --global npm@11.16.0

      - run: npm ci
      - run: npm run release:check

      - name: Upload coverage to Codecov
        if: matrix.node-label == 24
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: packages/core/test-output/vitest/coverage/lcov.info,packages/chakra-email/test-output/vitest/coverage/lcov.info,packages/chakra-email-v2/test-output/vitest/coverage/lcov.info,packages/code-block/test-output/vitest/coverage/lcov.info,packages/markdown/test-output/vitest/coverage/lcov.info,packages/preview/test-output/vitest/coverage/lcov.info,packages/react-email/test-output/vitest/coverage/lcov.info,apps/preview-ui/test-output/vitest/coverage/lcov.info,apps/site/test-output/vitest/coverage/lcov.info
          fail_ci_if_error: false

  # Node 20 is EOL, but the published packages retain a documented >=20.19
  # compatibility floor for Node's unflagged require(esm) support.
  minimum-node-compatibility:
    name: Compatibility floor (Node 20.19 / React 18)
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20.19.0
          cache: npm

      - name: Install pinned npm
        run: npm install --global npm@11.16.0

      - run: npm ci
      - run: npm run build
      - run: npm run smoke:consumer
