name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (Node ${{ matrix.node-label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - node-label: 22
            node-version: 22
          - node-label: 24
            node-version: 24.18.0
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install pinned npm
        run: npm install --global npm@11.16.0

      - run: npm ci
      - run: npm run release:check

      - name: Check public theme declaration performance
        run: npm run types:performance:check

      - name: Upload coverage to Codecov
        if: matrix.node-label == 24
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: packages/core/test-output/vitest/coverage/lcov.info,packages/chakra-email/test-output/vitest/coverage/lcov.info,packages/chakra-email-v2/test-output/vitest/coverage/lcov.info,packages/code-block/test-output/vitest/coverage/lcov.info,packages/markdown/test-output/vitest/coverage/lcov.info,packages/preview/test-output/vitest/coverage/lcov.info,packages/react-email/test-output/vitest/coverage/lcov.info,apps/preview-ui/test-output/vitest/coverage/lcov.info,apps/site/test-output/vitest/coverage/lcov.info
          fail_ci_if_error: false

  # Node 20 is EOL, but the published packages retain a documented >=20.19
  # compatibility floor for Node's unflagged require(esm) support.
  minimum-node-compatibility:
    name: Compatibility floor (Node 20.19 / React 18)
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20.19.0
          cache: npm

      - name: Install pinned npm
        run: npm install --global npm@11.16.0

      - run: npm ci
      - run: npm run build
      - run: npm run smoke:consumer
