name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (Node 24)
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false

      - name: Enable pinned pnpm
        run: corepack enable

      - run: pnpm install --frozen-lockfile
      - run: pnpm run release:check

      - name: Check public theme declaration performance
        run: pnpm run types:performance:check

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: packages/core/test-output/vitest/coverage/lcov.info,packages/chakra-email/test-output/vitest/coverage/lcov.info,packages/chakra-email-v2/test-output/vitest/coverage/lcov.info,packages/code-block/test-output/vitest/coverage/lcov.info,packages/markdown/test-output/vitest/coverage/lcov.info,packages/preview/test-output/vitest/coverage/lcov.info,packages/react-email/test-output/vitest/coverage/lcov.info,apps/preview-ui/test-output/vitest/coverage/lcov.info,apps/site/test-output/vitest/coverage/lcov.info
          fail_ci_if_error: false

  # Node 20 is EOL, but the published packages retain a documented >=20.19
  # compatibility floor for Node's unflagged require(esm) support.
  minimum-node-compatibility:
    name: Compatibility floor (Node 20.19 / React 18)
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false

      - name: Enable pinned pnpm
        run: corepack enable

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

      # Build with the pinned development runtime, then exercise the packed
      # artifacts with the supported consumer runtime (no workspace install).
      - name: Switch to the consumer compatibility floor
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20.19.0
          package-manager-cache: false

      - run: node scripts/smoke-packed-consumer.mjs
