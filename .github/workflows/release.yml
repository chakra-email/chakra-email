name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version specifier; first releases require an explicit semantic version such as 0.1.0'
        type: string
        required: true
        default: 'patch'
      dry_run:
        description: 'Preview version, changelog, and publish output without pushing or publishing'
        type: boolean
        required: true
        default: true
      first_release:
        description: 'Use with an explicit version when no release tag or published package exists yet'
        type: boolean
        required: false
        default: false

permissions:
  actions: read
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  require-main:
    name: Require main branch
    runs-on: ubuntu-latest
    steps:
      - name: Reject non-main dispatches
        if: github.ref != 'refs/heads/main'
        run: |
          echo 'Releases must be dispatched from the main branch.' >&2
          exit 1
      - run: echo 'Release is pinned to main at ${{ github.sha }}.'

  require-ci:
    name: Require successful CI for release commit
    needs: require-main
    runs-on: ubuntu-latest
    steps:
      - name: Require successful CI for the exact main commit
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIED_SHA: ${{ github.sha }}
        run: |
          ci_run_id="$(
            gh api \
              --method GET \
              -H 'Accept: application/vnd.github+json' \
              "/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs" \
              -f branch=main \
              -f event=push \
              -f head_sha="$VERIFIED_SHA" \
              -f status=success \
              -f per_page=1 \
              --jq '.workflow_runs[0].id // empty'
          )"
          if [ -z "$ci_run_id" ]; then
            echo "No successful CI push run exists for $VERIFIED_SHA." >&2
            echo 'Wait for CI to complete successfully, then dispatch Release again.' >&2
            exit 1
          fi
          echo "CI run $ci_run_id successfully verified $VERIFIED_SHA."

  dry-run:
    name: Preview release
    if: inputs.dry_run
    needs: require-ci
    runs-on: ubuntu-latest
    steps:
      - name: Check out source without credentials
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install pinned npm
        run: npm install --global npm@11.16.0

      - run: npm ci

      - name: Preview release
        run: node scripts/run-release.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_DRY_RUN: 'true'
          RELEASE_FIRST_RELEASE: ${{ inputs.first_release }}
          RELEASE_VERSION: ${{ inputs.version }}

  publish:
    name: Publish release
    if: ${{ !inputs.dry_run }}
    needs: require-ci
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out source without credentials
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'

      - name: Install pinned npm
        run: npm install --global npm@11.16.0

      # Install before adding push credentials so dependency lifecycle scripts
      # cannot read a write-capable GitHub token from the repository config.
      - run: npm ci

      - name: Enable push credentials on main
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          clean: false
          fetch-depth: 0
          persist-credentials: true
          ref: main

      - name: Require the verified main commit
        env:
          VERIFIED_SHA: ${{ github.sha }}
        run: |
          current_branch="$(git branch --show-current)"
          current_sha="$(git rev-parse HEAD)"
          if [ "$current_branch" != 'main' ]; then
            echo "Expected main, checked out $current_branch instead." >&2
            exit 1
          fi
          if [ "$current_sha" != "$VERIFIED_SHA" ]; then
            echo 'main advanced after release verification; dispatch a new release.' >&2
            exit 1
          fi

      - name: Configure git user
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Validate the one-time bootstrap token
        if: inputs.first_release
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo 'NPM_BOOTSTRAP_TOKEN is required for the first publish.' >&2
            exit 1
          fi
          npm whoami >/dev/null
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}

      - name: Publish release
        run: node scripts/run-release.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Existing packages authenticate with npm trusted publishing (OIDC).
          # A token is exposed only for the one-time package bootstrap.
          NODE_AUTH_TOKEN: ${{ inputs.first_release && secrets.NPM_BOOTSTRAP_TOKEN || '' }}
          NPM_CONFIG_PROVENANCE: 'true'
          RELEASE_DRY_RUN: 'false'
          RELEASE_FIRST_RELEASE: ${{ inputs.first_release }}
          RELEASE_VERSION: ${{ inputs.version }}
